<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unnamed section is not a landmark</title>
</head>
<body>
<h1>Unnamed section is not a landmark</h1>
<section>
<p>This section has no aria-label or aria-labelledby, so it does not become a region landmark and is not counted at all.</p>
</section>
</body>
