<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tables</title>
</head>
<body>
<h1>Tables</h1>

<h2>Presentation table (layout)</h2>
<table role="presentation" width="100%">
<tr><td><p>This table is marked as presentational and is used purely for layout.</p></td></tr>
</table>

<h2>Data table with a caption and header cells</h2>
<table>
<caption>Quarterly sales by region</caption>
<tr><th scope="col">Region</th><th scope="col">Sales</th></tr>
<tr><td>North</td><td>$12,000</td></tr>
<tr><td>South</td><td>$9,500</td></tr>
</table>

<h2>Data table without a caption or header cells</h2>
<table>
<tr><td>Region</td><td>Sales</td></tr>
<tr><td>North</td><td>$12,000</td></tr>
<tr><td>South</td><td>$9,500</td></tr>
</table>

</body>
</html>
