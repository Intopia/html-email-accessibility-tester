<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duplicate IDs</title>
</head>
<body>
<h1>Duplicate IDs</h1>
<p>The two links below share the same id, "cta", which breaks any aria-labelledby or anchor reference that points to it.</p>
<p><a href="https://example.com/offer-a" id="cta">View offer A</a></p>
<p><a href="https://example.com/offer-b" id="cta">View offer B</a></p>
</body>
</html>
